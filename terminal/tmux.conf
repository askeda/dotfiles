# General
set -g base-index 1
set -g mouse on

# Keymaps
bind-key x kill-pane
bind-key & kill-window
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Theme
set -g @catppuccin_flavor 'mocha'

# Windows
set -g @catppuccin_window_status_style         "rounded"
set -g @catppuccin_window_text                 " #W"
set -g @catppuccin_window_current_text         " #W"
set -g @catppuccin_window_current_number_color "#{@thm_teal}"

# Date & Time
set -g @catppuccin_status_date_time_icon_bg "#cba6f7"

# Status bar
set -g @catppuccin_directory_icon " "
set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g status-left              ""
set -g status-left-length       100
set -g status-right-length      100
set -g status-right             "#{E:@catppuccin_status_session} #{E:@catppuccin_status_directory} #{E:@catppuccin_status_date_time}"

run '~/.tmux/plugins/tpm/tpm'
